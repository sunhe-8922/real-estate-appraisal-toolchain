# anonymize_rules.yaml — 评估明细表模糊化规则配置
#
# 用法：anonymize_template.py 自动加载本文件（同目录）
# 规则按优先级执行：numeric → text → regex
#
# 修改本文件后重新运行 anonymize_template.py 即可，无需改代码。

# ── 文本精确替换 ──────────────────────────────────────────
# key = 源文件中的实际文本，value = 替换后的占位文本
# 使用时请将 【真实XXX】 替换为源文件中的实际文本
text_replacements:
  # 委托人/权属人
  "【真实公司名】投资有限公司": "XX投资有限公司"
  # 评估机构
  "【真实评估机构名】": "XX土地房地产与资产评估有限公司"
  # 评估人员
  "【评估师A姓名】": "评估师A"
  "【评估师B姓名】": "评估师B"
  # 估价对象地址
  "【真实地址】": "XX市XX区XX路XX号XX小区XX栋XX房"
  "【真实楼盘名】": "XX山庄"
  # 可比实例名称
  "【可比实例A名】": "XX苑"
  "【可比实例A名】住宅": "XX苑住宅"
  "【可比实例B名】": "XX湾山庄"
  "【可比实例B名】住宅": "XX湾山庄住宅"
  "【可比实例C完整地址】": "XX市XX路XX山庄XX栋别墅"
  "【可比实例C名】": "XX山庄"
  "【可比实例D名】": "XX居"
  # 学校/公共设施
  "【真实学校名A】": "XX中学"
  "【真实学校名A(校区)】": "XX中学"
  "【真实小学名】": "XX小学"
  "【真实幼儿园A名】": "XX幼儿园"
  "【真实幼儿园B名】": "XX幼儿园"
  "【真实幼儿园C名】": "XX小学及幼儿园"
  "【真实公园名】": "XX森林公园"
  "【真实幼儿园D名】": "XX幼儿园"
  "【真实中学B名】": "XX中学"
  "【真实医院名】": "XX医院"
  "【真实超市A名】": "XX超市"
  "【真实超市B名】": "XX超市"
  "【真实赛车场名】": "XX赛车场"
  "【真实俱乐部名】": "XX俱乐部"
  # 公交站/道路
  "【真实公交站A名】": "XX站"
  "【真实公交站B名】": "XX站"
  "【真实公交站C名】": "XX站"
  "【真实道路名】": "XX大道"
  # 权属证号
  "《【真实城市名】市商品房买卖合同》": "《商品房买卖合同》"

# ── 正则替换 ──────────────────────────────────────────────
# pattern = 正则表达式，replacement = 替换文本
regex_replacements:
  - pattern: 'https?://[^\s"]+'
    replacement: ""
    description: "URL 链接 → 删除"
  - pattern: '1[3-9]\d{9}'
    replacement: "XXXXXXXXXXX"
    description: "手机号 → 掩码"
  - pattern: '\d{17}[\dXx]'
    replacement: "XXXXXXXXXXXXXXXXXX"
    description: "身份证号 → 掩码"

# ── 数值替换（精确单元格定位）──────────────────────────────
# key = "sheet_name!cell_coord"，value = 替换值
# 使用时根据实际源文件调整坐标和值
numeric_replacements:
  # 评估明细表 - 评估单价
  "评估明细表!N6": 38000
  "评估明细表!N7": 38000
  # 评估明细表 - 套内面积
  "评估明细表!L6": 540.00
  "评估明细表!M6": 580.00
  "评估明细表!L7": 38.00
  "评估明细表!M7": 40.00
  # 评估明细表 - 原购买价
  "评估明细表!W6": 38000
  # 市场价比较法 - 可比实例成交价
  "市场价比较法!E4": 31000
  "市场价比较法!F4": 30000
  "市场价比较法!G4": 28000
  # 市场价比较法 - 可比实例面积
  "市场价比较法!E24": 450.00
  "市场价比较法!F24": 200.00
  "市场价比较法!G24": 270.00
  # 可比案例
  "可比案例!G53": 1100000
  "可比案例!G54": 1100000
  "可比案例!G55": 1600000
  "可比案例!G56": 1600000
  "可比案例!G58": 2300000
  "可比案例!G59": 2300000

# ── 验证扫描关键词 ─────────────────────────────────────────
# 模糊化后扫描这些关键词，命中则需人工确认
verify_patterns:
  - pattern: "投资"
    description: "可能的公司名"
  - pattern: "评估有限公司"
    description: "可能的机构名"
  - pattern: "https://"
    description: "URL链接"
